# Git hooks for leafdump.  Install once per clone:  make hooks
#
# Every job shells out to a make target. The Makefile is the single definition
# of each gate, so a hook can never check something different from CI.
#
# Split by cost, deliberately: pre-commit stays fast, because a hook slow enough
# to be annoying gets bypassed with --no-verify, and a hook everyone bypasses is
# worse than no hook -- it manufactures false confidence. The expensive gates
# (mypy, the vulnerability audit) run at push time instead.

min_version: 1.10.0

# Sourced by the generated hook scripts before lefthook runs. `make hooks`
# writes it, pointing LEFTHOOK_BIN at the pinned binary in .venv-tools. Without
# it the hook searches PATH, node_modules, bundler, yarn... and when it finds
# nothing it prints "Can't find lefthook in PATH" and exits 0 -- a hook that
# silently passes.
#
# The leading ./ is required, not cosmetic: sh's `.` builtin searches PATH when
# its argument contains no slash, so a bare filename is never found in dash.
rc: ./.lefthook-rc.sh

pre-commit:
  parallel: true
  jobs:
    - name: format
      run: make fmt-check
      fail_text: "unformatted code — run: make fmt"

    - name: lint
      run: make lint
      fail_text: "lint findings — fixable ones: make lint-fix"

    # Cheap (one interpreter start) and catches the mistake that is hardest to
    # notice locally: an optional import escaping to module scope, which works
    # on every machine that has the package and breaks only for the person who
    # installed leafdump without extras.
    - name: core is dependency-free
      run: make core-check

    # The commit is the moment this has to be caught. Once an internal doc is in
    # a commit it is in the history, and deleting it later does not take it out
    # -- the fix stops being a commit and becomes a rewrite. Also runs at push,
    # below, because this one is worth catching twice.
    - name: nothing private reaches the public tree
      run: make docs-check

    # MANIFEST.in is generated from scripts/manifest_in.py, so the two can be
    # committed out of step. One interpreter start, and the alternative to
    # catching it here is catching it in CI's sdist job minutes later.
    - name: MANIFEST.in is current
      run: make manifest-check

    # One interpreter start. Catches the half-finished bump -- __version__ moved,
    # the manpage not -- at the moment it is cheapest to finish.
    - name: versions agree
      run: make version-check

pre-push:
  parallel: false
  jobs:
    # First, and duplicated from pre-commit, because it is the only gate here
    # whose failure is irreversible. Everything else in this file can be fixed
    # with another commit; a published internal doc can only be unpublished by
    # rewriting history that other people may already have fetched.
    - name: nothing private reaches the public tree
      run: make docs-check

    - name: types
      run: make typecheck

    # Flags and completions drift apart silently: adding an option to cli.py
    # breaks nothing, it just stops being offered by the three completion
    # scripts. Push time is early enough to catch it and cheap enough to check.
    - name: completions
      run: make completions-check

    - name: test
      run: make test

    # Last, and the only gate here that touches a build artifact rather than
    # the tree. Push is the moment for it. `manifest-check` runs at commit time
    # and compares MANIFEST.in against its generator, which is the cheap half;
    # what this adds is the half that comparison structurally cannot reach -- a
    # fixture directory added to a test with no pattern carrying it, where both
    # files are self-consistent and the tarball is still short. CI runs it too,
    # but that verdict arrives after the push has landed, and this repository
    # pushes to master. Three seconds, less than the mypy run above.
    - name: the sdist passes its own suite
      run: make sdist-check

commit-msg:
  jobs:
    - name: subject length
      run: |
        subject=$(head -1 "{1}")
        # Allow fixup!/squash! through untouched.
        case "$subject" in fixup!*|squash!*) exit 0 ;; esac
        if [ "${#subject}" -gt 72 ]; then
          echo "commit subject is ${#subject} chars; keep it under 72"
          exit 1
        fi
