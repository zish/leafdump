# Release: cut the artifacts a tag promises.
#
# Two kinds of artifact, and they answer different questions. The sdist and
# wheel are for anyone with a Python; the single-file binaries are for anyone
# without one -- a container, a jump host, a CI image that has no interpreter
# and no permission to install packages. Both are attested, so a downloader can
# verify that the file in front of them came from this workflow and this commit
# rather than from someone's laptop.
#
# The sdist and wheel also go to PyPI, through trusted publishing: the `pypi`
# job below exchanges a short-lived OIDC token for upload rights, so there is no
# API token stored here to leak or rotate. The publisher is registered on PyPI's
# side against this repository, this workflow file and the `pypi` environment;
# all four have to agree or the upload is refused.
#
# Binaries are built for Linux and macOS. Windows is missing for a specific
# reason rather than an oversight -- the runner image has no make(1), so a
# Windows leg would either install one through Chocolatey or restate the whole
# Nuitka invocation in YAML, and restating it is exactly the drift this
# arrangement exists to prevent. Nuitka/Nuitka-Action is the tidy way in if
# Windows binaries are wanted later.

name: Release

on:
  push:
    tags: ["v*"]
  # Buildable without tagging, to check the artifacts before committing to them.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the job's token in .git/config unless told not
          # to. Nothing here needs to push, and a workspace that gets
          # archived would carry the credential with it.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # First, and before anything is built: this is the tag-versus-tree check.
      # A `v1.1.0` tag on a commit that still says 1.0.0 would otherwise upload
      # a 1.0.0 artifact, to an index where that number is then taken forever.
      - run: make version-check

      # sdist-check rather than dist: it builds the same artifacts and then
      # unpacks the tarball and runs the suite inside it. The tarball uploaded
      # here is the one published, so proving it before the upload is the only
      # placement that covers what is actually shipped.
      - run: make sdist-check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  binary:
    name: binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: leafdump-linux-x86_64
          - os: macos-latest
            asset: leafdump-macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the job's token in .git/config unless told not
          # to. Nothing here needs to push, and a workspace that gets
          # archived would carry the credential with it.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # No ccache here, deliberately, and the contrast with ci.yml is the point.
      # GitHub's cache is writable from pull-request runs, so a release build
      # that restores one is compiling with objects an outside contributor could
      # have placed there -- and those objects end up inside a signed, published
      # executable. CI can spend that risk to save minutes on a throwaway
      # artifact. A release cannot, so this leg compiles from source every time.
      - run: make binary

      # The gate that matters for a shipped binary. `make binary` succeeding
      # says the C compiled; this says the codecs are actually in there and
      # actually run, which is a different claim entirely for a package that
      # reaches all of them through importlib and a string.
      - run: make binary-check

      - name: name the asset for the platform it runs on
        run: mv bin/leafdump "bin/${{ matrix.asset }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: bin/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: attest and attach to the release
    needs: [dist, binary]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release and upload to it
      id-token: write       # sign the provenance attestation
      attestations: write   # record it
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: list what will be published
        run: ls -lh artifacts/

      # Provenance ties each file to this workflow, this repository and this
      # commit, verifiable afterwards with:
      #     gh attestation verify leafdump-linux-x86_64 --repo <owner>/<repo>
      # For a downloaded executable that is the difference between trusting the
      # file and trusting whoever handed it to you.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*

      # gh(1) is preinstalled on the runners, so the release is cut without a
      # third-party action -- one less external repository with write access to
      # this one's releases.
      # GH_REPO because this job deliberately does not check the repository out
      # -- it needs four built files, not a source tree. gh(1) normally works
      # out which repository to act on by reading the git remote of the
      # directory it is run from, and with no checkout there is no remote and
      # no .git, so it exits with "fatal: not a git repository" before it ever
      # reaches the API. Naming the repository explicitly is what that variable
      # is for, and it beats adding a checkout to produce a side effect.
      - name: create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" artifacts/* --clobber

  # Last, and gated on everything else. A package index keeps version numbers
  # forever: a wrong upload cannot be replaced, only yanked, and yanking hides
  # the number without freeing it. So this waits for the tarball to have passed
  # its own test suite, both binaries to have compiled, and the GitHub release
  # to exist and be attested. Anything that fails upstream of here fails before
  # a permanent decision is taken.
  #
  # Not named `publish` -- the attestation job above already holds that key.
  #
  # `environment: pypi` is not decoration. The registered publisher names that
  # environment, so PyPI rejects a token whose claim lacks it; and an
  # environment is where a required reviewer can be added, which is the only
  # way to put a human between a pushed tag and a permanent version number.
  pypi:
    name: publish to PyPI
    needs: [dist, binary, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # mint the OIDC token trusted publishing exchanges
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # Only the sdist and wheel. The binaries are GitHub release assets and
      # have no place on a Python index; pointing this at the merged artifact
      # directory would try to upload them and fail.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          print-hash: true
